<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="柔道が得意な、いのさんの自己紹介ページです。"
    />
    <title>いのさん | 自己紹介</title>
    <style>
      :root {
        --ink: #17233b;
        --navy: #233a63;
        --red: #c8463a;
        --paper: #f7f3e9;
        --tatami: #dce1c0;
        --white: #fffdfa;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(90deg, transparent 49.85%, rgba(35, 58, 99, 0.05) 50%, transparent 50.15%),
          linear-gradient(rgba(35, 58, 99, 0.03) 1px, transparent 1px),
          var(--paper);
        background-size: 100% 100%, 100% 32px, auto;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
      }

      .page {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
        padding: 32px;
      }

      .page::before,
      .page::after {
        position: absolute;
        z-index: -1;
        border-radius: 999px;
        content: "";
      }

      .page::before {
        top: -160px;
        right: -120px;
        width: 420px;
        height: 420px;
        background: var(--tatami);
      }

      .page::after {
        bottom: -80px;
        left: -60px;
        width: 220px;
        height: 220px;
        border: 40px solid rgba(200, 70, 58, 0.1);
      }

      .profile {
        display: grid;
        grid-template-columns: minmax(240px, 0.8fr) minmax(300px, 1.2fr);
        width: min(920px, 100%);
        min-height: 540px;
        overflow: hidden;
        border: 1px solid rgba(23, 35, 59, 0.12);
        border-radius: 28px;
        background: var(--white);
        box-shadow: 0 24px 80px rgba(23, 35, 59, 0.14);
      }

      .portrait {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.08) 0,
            rgba(255, 255, 255, 0.08) 2px,
            transparent 2px,
            transparent 9px
          ),
          var(--navy);
      }

      .portrait::before {
        position: absolute;
        width: 240px;
        height: 240px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        content: "";
      }

      .portrait::after {
        position: absolute;
        bottom: 64px;
        width: 120%;
        height: 17px;
        background: var(--red);
        box-shadow: 0 9px 0 rgba(17, 26, 45, 0.42);
        content: "";
        transform: rotate(-7deg);
      }

      .monogram {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 178px;
        height: 178px;
        border: 8px solid rgba(255, 255, 255, 0.94);
        border-radius: 50%;
        color: var(--white);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: 6.5rem;
        font-weight: 700;
        line-height: 1;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.2);
        animation: enter 700ms ease-out both;
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: clamp(44px, 8vw, 88px);
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--red);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.22em;
      }

      h1 {
        margin: 0;
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: clamp(3.6rem, 9vw, 6.3rem);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 0.95;
      }

      .name-suffix {
        margin-left: 0.12em;
        font-size: 0.42em;
        letter-spacing: 0;
      }

      .divider {
        width: 64px;
        height: 4px;
        margin: 36px 0;
        border: 0;
        border-radius: 999px;
        background: var(--red);
      }

      .intro {
        margin: 0;
        font-size: clamp(1.15rem, 2.4vw, 1.45rem);
        font-weight: 500;
        line-height: 1.9;
      }

      .skill {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 34px;
        padding: 18px 22px;
        border: 1px solid rgba(35, 58, 99, 0.13);
        border-radius: 16px;
        background: rgba(220, 225, 192, 0.35);
      }

      .skill-mark {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        color: var(--white);
        background: var(--red);
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-weight: 700;
      }

      .skill-label {
        display: block;
        margin-bottom: 3px;
        color: rgba(23, 35, 59, 0.62);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }

      .skill-name {
        font-size: 1.2rem;
        font-weight: 800;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: scale(0.88) rotate(-5deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }

      @media (max-width: 700px) {
        .page {
          padding: 18px;
        }

        .profile {
          grid-template-columns: 1fr;
          min-height: auto;
        }

        .portrait {
          min-height: 280px;
        }

        .portrait::after {
          bottom: 34px;
        }

        .monogram {
          width: 142px;
          height: 142px;
          font-size: 5rem;
        }

        .content {
          padding: 42px 32px 48px;
        }

        .divider {
          margin: 28px 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .monogram {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article class="profile" aria-labelledby="profile-title">
        <div class="portrait" aria-hidden="true">
          <div class="monogram">い</div>
        </div>

        <section class="content">
          <p class="eyebrow">ABOUT INO</p>
          <h1 id="profile-title">いの<span class="name-suffix">さん</span></h1>
          <hr class="divider" />
          <p class="intro">
            こんにちは、いのです。<br />
            柔道が得意です。
          </p>

          <div class="skill">
            <span class="skill-mark" aria-hidden="true">柔</span>
            <div>
              <span class="skill-label">SPECIALTY</span>
              <span class="skill-name">柔道</span>
            </div>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
